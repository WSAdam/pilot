<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>pilot bench page</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    nav a { margin-right: 1rem; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <nav><a href="#home">Home</a><a href="#docs">Docs</a><a href="#about">About</a></nav>
  <h1>Bench page</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" type="email">
    <label><input type="checkbox" id="terms"> Accept terms</label>
    <select id="plan"><option>Free</option><option>Pro</option></select>
    <button type="button" id="submit">Submit</button>
  </form>
  <main id="list"></main>
  <script>
    const list = document.getElementById('list');
    for (let index = 0; index < 50; index++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h2>Item ${index}</h2><p>Description for item ${index}.</p><button type="button">Open ${index}</button>`;
      list.appendChild(card);
    }
  </script>
</body>
</html>
