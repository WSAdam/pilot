name: pilot gate

# DIAGNOSIS BRANCH ONLY (gate/diag-b8-stack), never merged: Build 8's first gate
# run (44155204410) overflowed the stack in one upstream worker test, which
# passes alone. Round 2 runs it repeatedly under CPU load inside gdb, on the 3b
# base and on Build 8, and prints the backtrace at the overflow.
on:
  push:
    branches: ["gate/diag-**"]

concurrency:
  group: pilot-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TZ: UTC
  TEST_FILTER: test(=runtime::page_vm::tests::worker::worker_messages_and_service_workers::child_message_handler_external_dedicated_worker_binds_child_client_event_owner)

jobs:
  leg:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "base 3b f8b48afac", sha: f8b48aface51d9625fba30c747c1927cdd41901b }
          - { label: "build8 f095c9f40", sha: f095c9f40148eb6f2bc5e6a703aae0ada27a295b }
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Free disk and add swap
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          if mountpoint -q /mnt; then swapfile=/mnt/pilot-swap; else swapfile=/pilot-swap; fi
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" >/dev/null
          sudo swapon "$swapfile"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libclang-dev time pkg-config \
            libfontconfig1-dev libfreetype-dev libsqlite3-dev zlib1g-dev libssl-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(tr -d '[:space:]' < rust-toolchain)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: nextest@0.9.132

      - name: Install gdb
        run: sudo apt-get install --yes --no-install-recommends gdb

      - name: Build the renderer tests
        run: |
          set -euo pipefail
          cargo test -p moli-renderer-v8 --lib --no-run 2>&1 | tee build.log
          bin=$(grep -o 'target/debug/deps/moli_renderer_v8-[a-f0-9]*' build.log | head -1)
          echo "TEST_BIN=$bin" >> "$GITHUB_ENV"

      - name: The test under load in gdb
        run: |
          set -uo pipefail
          name=runtime::page_vm::tests::worker::worker_messages_and_service_workers::child_message_handler_external_dedicated_worker_binds_child_client_event_owner
          for i in $(seq 1 8); do yes > /dev/null & done
          crashed=0
          for run in $(seq 1 30); do
            start=$(date +%s)
            timeout 300 gdb -q -batch -nx \
              -ex 'set pagination off' -ex 'handle SIGPIPE nostop noprint' -ex 'handle SIGUSR1 nostop noprint' \
              -ex run -ex 'echo \n=== innermost frames ===\n' -ex 'bt 60' -ex 'echo \n=== outermost frames ===\n' -ex 'bt -25' \
              --args "$TEST_BIN" --exact "$name" --test-threads 1 --nocapture > "gdb-$run.log" 2>&1
            took=$(( $(date +%s) - start ))
            if grep -q "SIGSEGV\|overflow\|SIGABRT" "gdb-$run.log"; then
              echo "❌ run $run crashed after ${took}s"; cat "gdb-$run.log" | cut -c1-300 | tail -150; crashed=1; break
            fi
            echo "✅ run $run: $(grep -o 'test result: [a-z]*' "gdb-$run.log" | head -1) in ${took}s"
          done
          kill $(jobs -p) 2>/dev/null || true
          exit $crashed
