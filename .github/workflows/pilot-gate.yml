name: pilot gate

# DIAGNOSIS BRANCH ONLY (gate/diag-b8-core), never merged: the gate's full nextest
# run with core dumps on, to get the backtrace of the worker test that overflows
# its stack only in the full run (gate runs 44155204410, 44196996026).
#
# pilot's build gate, run on GitHub's machines instead of the developer's Mac:
# one rustc of moli-renderer-v8 (a single 1.35M-line crate) peaks at 6-7 GB.
# Work is pushed to a gate/<label> branch; main is fast-forwarded to it only when
# both jobs pass. The MCP and open-web sweeps run locally on the macOS binary this
# uploads, because their timings and bot-wall results depend on the Mac and its IP.
on:
  push:
    branches: ["gate/diag-**"]
  workflow_dispatch:
    inputs:
      macos_only:
        description: Skip Linux and run only the macOS job (diagnosis rounds; landing needs a full run)
        type: boolean
        default: false

concurrency:
  group: pilot-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TZ: UTC

jobs:
  linux:
    name: ${{ matrix.leg }}
    # gate/mac-<label> branches run only the macOS job (diagnosis rounds).
    if: ${{ !inputs.macos_only && !startsWith(github.ref_name, 'gate/mac-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [without-fix, with-fix]
    timeout-minutes: 330
    env:
      # 16 GB runner: two renderer rustc processes at once still fit, with swap as a margin.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: 602b9f6d16c7f768213270cf65633572104f0ade

      - name: Free disk and add swap
        run: |
          set -euo pipefail
          echo "🔍 before"; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          if mountpoint -q /mnt; then swapfile=/mnt/pilot-swap; else swapfile=/pilot-swap; fi
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" >/dev/null
          sudo swapon "$swapfile"
          echo "✅ after"; df -h /; free -h

      - name: Install build dependencies
        # Upstream's CI builds inside rust:bookworm, which ships these; the bare Ubuntu
        # runner does not. fontconfig (moli-system-fonts) failed the first gate run.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libclang-dev time pkg-config \
            libfontconfig1-dev libfreetype-dev libsqlite3-dev zlib1g-dev libssl-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(tr -d '[:space:]' < rust-toolchain)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: nextest@0.9.132

      - name: Install gdb
        run: sudo apt-get install --yes --no-install-recommends gdb

      - name: Remove the fix (leg without-fix)
        if: matrix.leg == 'without-fix'
        run: |
          set -euo pipefail
          grep -n "let future = Box::pin(future);" moli-renderer-v8/src/runtime/access.rs
          sed -i '/let future = Box::pin(future);/d' moli-renderer-v8/src/runtime/access.rs
          ! grep -q "let future = Box::pin(future);" moli-renderer-v8/src/runtime/access.rs

      - name: Build the tests the workspace way
        run: cargo nextest run --workspace --no-run

      - name: The new large-future test
        run: |
          set +e
          cargo nextest run --workspace --retries 0 -E 'test(=runtime::access::tests::a_large_owner_task_future_is_spawned_without_copies_on_the_stack)'
          echo "large-future test exit $?"
          exit 0

      - name: The worker test, workspace build
        if: matrix.leg == 'with-fix'
        run: cargo nextest run --workspace --retries 0 -E 'test(=runtime::page_vm::tests::worker::worker_messages_and_service_workers::child_message_handler_external_dedicated_worker_binds_child_client_event_owner)'
