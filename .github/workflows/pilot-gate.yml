name: pilot gate

# DIAGNOSIS BRANCH ONLY (gate/diag-b8-stack), never merged: Build 8's first gate
# run (44155204410) overflowed the stack in one upstream worker test. Each leg
# checks out one Build 8 commit and runs only that test, with the default test
# thread stack and then with a 64 MiB one, to find the commit and tell real
# recursion from deeper frames.
on:
  push:
    branches: ["gate/diag-**"]

concurrency:
  group: pilot-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TZ: UTC
  TEST_FILTER: test(=runtime::page_vm::tests::worker::worker_messages_and_service_workers::child_message_handler_external_dedicated_worker_binds_child_client_event_owner)

jobs:
  leg:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "1 inserted-script 0e2244b3e", sha: 0e2244b3e93f6d211dccd829d8b13ae0c9f7e0e0 }
          - { label: "2 file-url 5787187c3", sha: 5787187c3b1c713a4d7e53e9ff8e65945193951b }
          - { label: "3 page-started-beforeunload 2c6fa11d3", sha: 2c6fa11d33914fec8c6d10a1f8ca2fa4eda5400e }
          - { label: "4 meta-viewport 53774ad2e", sha: 53774ad2ef3b2659e32f94fa340858217352dcf1 }
          - { label: "5 beforeunload-event 604366129", sha: 6043661291c0650304dc5fe4713665d555f0ccc9 }
          - { label: "6 layout-metrics f62e7ba6c", sha: f62e7ba6cda3f4c9b42d0bab3df30917dbe24c56 }
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}

      - name: Free disk and add swap
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          if mountpoint -q /mnt; then swapfile=/mnt/pilot-swap; else swapfile=/pilot-swap; fi
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" >/dev/null
          sudo swapon "$swapfile"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libclang-dev time pkg-config \
            libfontconfig1-dev libfreetype-dev libsqlite3-dev zlib1g-dev libssl-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(tr -d '[:space:]' < rust-toolchain)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: nextest@0.9.132

      - name: Build the renderer tests
        run: cargo nextest run -p moli-renderer-v8 --no-run

      - name: The test, default stack
        run: cargo nextest run -p moli-renderer-v8 --retries 0 --no-capture -E "$TEST_FILTER"

      - name: The test, 64 MiB stack
        if: always()
        env:
          RUST_MIN_STACK: "67108864"
        run: cargo nextest run -p moli-renderer-v8 --retries 0 --no-capture -E "$TEST_FILTER"
