<!doctype html>
<title>Legacy leave guard</title>
<button id="touch">Click me</button>
<script>
  // The legacy ways to ask before leaving, still common on the web: a
  // handler attribute that returns a string, or a listener that sets
  // returnValue to a non-empty string without calling preventDefault().
  const style = new URLSearchParams(location.search).get('style');
  if (style === 'return') {
    window.onbeforeunload = () => 'You have unsaved changes';
  } else {
    addEventListener('beforeunload', (event) => { event.returnValue = 'You have unsaved changes'; });
  }
</script>
