<!doctype html>
<html>
<head><title>labelled controls</title></head>
<body>
  <p id="out">nothing yet</p>
  <form onsubmit="event.preventDefault()">
    <p><label><input type="checkbox" id="terms"> I accept the terms</label></p>
    <p><label><input type="radio" name="plan" id="pro" value="pro"> Pro plan</label></p>
    <p><label>Email <input type="email" id="email"></label></p>
  </form>
  <script>
    const out = document.getElementById('out');
    document.getElementById('terms').addEventListener('change', (event) => { out.textContent = `terms ${event.target.checked}`; });
    document.getElementById('pro').addEventListener('change', () => { out.textContent = 'plan pro'; });
    document.getElementById('email').addEventListener('input', (event) => { out.textContent = `email ${event.target.value}`; });
  </script>
</body>
</html>
