[package]
name = "pilot"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Moli launched with Chromium's command line, so Playwright and Playwright MCP can start it as a browser"

[[bin]]
name = "pilot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive", "env"] }
moli = { path = "../moli" }
moli-browser-profile = { path = "../moli-browser-profile" }
moli-core = { path = "../moli-core" }
moli-process-signal = { path = "../moli-process-signal" }
moli-protocol-server = { path = "../moli-protocol-server" }
pilot-window = { path = "../pilot-window" }
tokio = { version = "1.51.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.41"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"
serde_json = "1.0.145"

[lints]
workspace = true
